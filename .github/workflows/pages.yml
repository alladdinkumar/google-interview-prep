name: Build and deploy the planner

on:
  push:
    branches: [main]
    # Every tick from the phone is a commit to webapp/progress.json, and every
    # skipped day a commit to webapp/schedule.json. Neither changes the built site
    # (the page reads both live from the API), so neither may trigger a build.
    paths:
      - 'plan/**'
      - 'daily-logs/TEMPLATE.md'
      - 'reviews/*/TEMPLATE.md'
      - 'webapp/**'
      - '!webapp/progress.json'
      - '!webapp/schedule.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # The tests gate the deploy: a plan edit that loses a topic's videos, names an
      # unknown LC problem, or drifts the JS twins from Python never goes live.
      - name: Build and test
        run: |
          python webapp/build_site.py
          python webapp/tests/catalogue_test.py
          python webapp/tests/make_fixtures.py
          node webapp/tests/parity.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
